name: 每日更新新闻数据

on:
  schedule:
    # 每天北京时间 7:00, 12:00, 18:00 执行 (UTC 23:00, 4:00, 10:00)
    - cron: '0 23 * * *'
    - cron: '0 4 * * *'
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: pip install requests

      - name: Fetch & update news
        run: python scripts/update_news.py

      - name: Check for changes
        id: changes
        run: |
          if [ -f news.json ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "news.json not generated, skipping."
          fi

      - name: Commit & push
        if: steps.changes.outputs.exists == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "自动更新新闻数据 ($(date -u -d '+8 hours' '+%Y-%m-%d %H:%M'))"
            git push
          fi
